<script type="build">
import{sep}from'node:path';
import cfg from'config_default';
import tmpl from'html_tmpl';

const
{host,auth,repo}=(x=>(
	x.match(/https?:\/\/(?:(?<user>.+?)@)?(?<host>.+?)\/(?<auth>.+?)\/(?<repo>.+?)\.git/)??
	x.match(/(?:(?<user>.+?)@)?(?<host>.+?):(?<auth>.+?)\/(?<repo>.+)/)
).groups)(await Bun.$`git remote get-url origin`.text()),
branch=process.env.WORKERS_CI_BRANCH??(await Bun.$`git branch --show-current`.text()).trim(),
f=w=>`<ul>${Object.entries(w).map(([i,x])=>typeof x=='string'?`<li>${x}</li>`:`<li>${i}${f(x)}</li>`).join('')}</ul>`;

export default async x=>(
	x=tmpl(cfg)(x),
	x.html=new HTMLRewriter().on('div#browse',{element:e=>e.append(
		f([...new Bun.Glob('proj/**/*.kicad_pro').scanSync('../')].reduce((a,w)=>(
			w.split(sep).slice(0,-1).reduce((a,x,i,w)=>(
				++i==w.length?a[x]=`<a href="https://${host}/${auth}/${repo}/tree/${branch}/${w.join('/')}">${x}</a>`:a[x]??={}
			),a),
			a
		),{})),
		{html:1}
	)}).transform(x.html),
	x
);
</script>

<main>
<h1>McbeEringi/pcb-stuff</h1>
<hr>
<div class="zab">
	<h2>Projects</h2>
	<div id="browse"></div>
</div>
</main>
